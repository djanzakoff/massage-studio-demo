:root{--bg:#0b171a;--ink:#eaf1e9;--mut:#a5b8b5;--line:#385357;--accent:#b8e1d0;--amber:#e6c5a1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--amber);outline-offset:4px}body{background:radial-gradient(ellipse at 65% 12%,#224249 0%,transparent 43%),linear-gradient(145deg,#0c1719,#101f20 70%,#0a1215)}.app{min-height:100svh;max-width:1550px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,5vw,75px);gap:15px}.brand{display:flex;align-items:center;gap:13px;font-size:13px;font-weight:800;letter-spacing:.24em}.brandmark{width:29px;height:29px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:20px;line-height:1}.sub{font-size:10px;color:var(--mut);letter-spacing:.19em;text-transform:uppercase}.right{display:flex;align-items:center;gap:14px}.stepnum{font-size:12px;color:var(--mut)}.progress{display:flex;gap:5px}.progress span{width:24px;height:3px;background:#436064;border-radius:5px}.progress span.on{background:var(--amber)}main{flex:1;display:grid;grid-template-columns:minmax(280px,45%) 1fr;align-items:center;gap:clamp(12px,3vw,55px);padding:20px clamp(20px,5vw,75px) 40px}.copy{position:relative;z-index:2;max-width:540px}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase;margin-bottom:20px;font-weight:700}.copy h1{font-weight:500;letter-spacing:-.065em;font-size:clamp(44px,5.7vw,88px);line-height:1.06;margin:0 0 24px}.copy h1 em{font-family:Georgia,serif;font-weight:400;color:var(--accent)}.desc{font-size:clamp(14px,1.25vw,17px);line-height:1.9;color:var(--mut);max-width:430px;margin:0 0 28px}.action{display:inline-flex;align-items:center;justify-content:space-between;gap:35px;min-width:240px;border:0;border-radius:2px;background:var(--accent);color:#11282a;padding:18px 20px;font-weight:800;font-size:13px}.action:hover{background:#e2f4e9}.action .arrow{font-size:22px;font-weight:400}.secondary{background:transparent;border:1px solid #66817e;color:var(--ink);padding:13px 17px;font-size:12px;margin-left:10px}.visual{position:relative;min-height:500px;height:min(70vh,680px);display:flex;align-items:center;justify-content:center;isolation:isolate}.visual:before{content:"";position:absolute;inset:7%;border:1px solid #355457;border-radius:50%;opacity:.65}.visual:after{content:"";position:absolute;inset:18%;border:1px dashed #3a5557;border-radius:50%;opacity:.4}.halo{position:absolute;width:min(88%,560px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#37626060 0%,#203c4140 45%,transparent 69%);filter:blur(15px)}.art{position:relative;width:min(100%,620px);height:100%;display:grid;place-items:center}.ribbon{width:100%;max-height:100%;filter:drop-shadow(0 25px 32px #0008)}.ribbon .line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:21}.ribbon .a{stroke:url(#r1)}.ribbon .b{stroke:url(#r2);stroke-width:9}.ribbon .c{stroke:#e5d2b7;stroke-width:3;opacity:.7}.float{animation:float 7s ease-in-out infinite;transform-origin:center}.orbit{animation:turn 34s linear infinite;transform-origin:center}@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}@keyframes turn{to{transform:rotate(360deg)}}.caption{position:absolute;bottom:7%;right:2%;text-align:right;font-size:10px;letter-spacing:.17em;color:#a5c0bb;text-transform:uppercase}.footer{padding:15px clamp(20px,5vw,75px) 25px;display:flex;justify-content:space-between;border-top:1px solid #2c4244;font-size:11px;color:var(--mut);gap:20px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}.chip{border:1px solid #537273;background:#183034aa;color:#d5e6e0;padding:13px 16px;min-width:58px;font-size:13px;border-radius:3px;transition:.2s}.chip:hover,.chip.sel{background:var(--accent);color:#10292b;border-color:var(--accent)}.levels{display:flex;gap:9px;margin-bottom:18px}.level{width:54px;height:62px;border:1px solid #587375;background:#193236;color:var(--ink);font-size:24px;border-radius:3px}.level.sel{background:var(--accent);color:#102729}.hint{font-size:12px;color:var(--mut);min-height:38px;margin-bottom:15px}.bodyfig{max-width:390px;width:72%;height:90%;overflow:visible}.bodyfig path.shape{fill:#89b6af24;stroke:#a8d3c8;stroke-width:2.5}.bodyfig .zone{fill:#a6d5c533;stroke:#c2e3d4;stroke-width:2;cursor:pointer;transition:.2s}.bodyfig .zone:hover,.bodyfig .zone.active{fill:#e6c5a1bb;stroke:#ffe1bc;filter:drop-shadow(0 0 9px #e6c5a1aa)}.bodyfig .joint{fill:#c6e1d7}.selectedcount{color:var(--amber);font-size:12px}.orb{width:min(76%,430px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 31% 26%,#d1f3df,#75a9a4 26%,#28595e 55%,#112a30 75%);box-shadow:inset -30px -30px 70px #061719aa,0 40px 90px #0009,0 0 100px #659a8944;animation:float 8s ease-in-out infinite;position:relative}.orb:after{content:"";position:absolute;inset:-20%;border:1px solid #7b9e9655;border-radius:50%;transform:rotateX(65deg) rotate(-22deg)}.orb.heat{background:radial-gradient(circle at 31% 26%,#f7dfb7,#c18c6b 28%,#74504b 55%,#2e2931 75%)}.orb.calm{background:radial-gradient(circle at 31% 26%,#d2e8ec,#8cb9be 25%,#466c80 55%,#1b303c 75%)}.orb.night{background:radial-gradient(circle at 31% 26%,#d3d2d9,#8b879d 25%,#4c536d 55%,#1b2636 75%)}.addons{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;margin-bottom:20px;max-width:440px}.addon{min-height:100px;text-align:left;border:1px solid #567171;background:#193136;color:var(--ink);padding:15px;border-radius:4px}.addon.sel{border-color:var(--amber);background:#39423b}.addon strong{display:block;font-size:14px;margin-bottom:9px}.addon small{color:var(--mut);font-size:11px}.addon.sel small{color:var(--amber)}.summary{background:#1a3435c9;border:1px solid #587673;padding:18px;max-width:460px;margin-bottom:24px}.summary div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #3a5553;font-size:12px}.summary div:last-child{border:0}.summary span{color:var(--mut)}.summary b{text-align:right;font-weight:600}.visualnote{position:absolute;top:11%;left:3%;font-size:11px;letter-spacing:.16em;color:var(--amber)}.reduced *{animation:none!important}@media(max-width:780px){.top{padding:18px 20px}.brand{font-size:11px}main{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:10px 24px 26px}.copy{order:2}.copy h1{font-size:clamp(42px,10vw,65px);margin-bottom:12px}.desc{font-size:13px;line-height:1.7;margin-bottom:20px}.eyebrow{margin-bottom:10px}.visual{order:1;height:37svh;min-height:230px;max-height:370px}.visual:before{inset:3% 20%}.visual:after{inset:15% 28%}.art{height:100%}.ribbon{height:100%}.bodyfig{height:100%;max-width:230px}.orb{max-width:240px}.caption{bottom:3%;right:0;font-size:8px}.visualnote{top:4%;font-size:9px}.footer{padding:15px 24px;font-size:9px}.action{width:100%;padding:15px 17px}.levels .level{flex:1}.secondary{margin:8px 0 0;width:100%}.addons{gap:7px}.addon{min-height:77px;padding:11px}.choices{gap:7px}.chip{padding:10px 12px}.summary{margin-bottom:14px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="brandmark">∿</span><div>АТЕЛЬЕ <div class="sub">студия массажа · демо</div></div></div><div class="right"><span class="stepnum" id="stepnum">01 / 05</span><div class="progress" id="progress"></div></div></header><main><section class="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p class="desc" id="description"></p><div id="controls"></div><button class="action" id="next"><span id="nextlabel">Начать</span><span class="arrow">↗</span></button><button class="secondary" id="back" style="display:none">Назад</button></section><section class="visual"><div class="halo"></div><div class="art" id="art"></div><div class="visualnote" id="visualnote">PERSONAL RITUAL / 001</div><div class="caption" id="caption">ТИШИНА. ДВИЖЕНИЕ. ВНИМАНИЕ.</div></section></main><footer class="footer"><span>ИНТЕРАКТИВНЫЙ КЛИЕНТСКИЙ ОПЫТ</span><span>ДЕМО · БЕЗ ПЕРЕДАЧИ ДАННЫХ</span></footer></div><script>
const $=s=>document.querySelector(s);const state={step:0,intensity:3,zones:[],mood:'Тишина',extras:[]};const zoneNames={neck:'Шея и плечи',back:'Спина',arms:'Руки',waist:'Поясница',legs:'Ноги'};const intensityText=['Очень мягко','Мягко','Сбалансированно','Глубже','Интенсивно'];const pages=[{ey:'01 / ВАШ РИТУАЛ',title:'Время <em>для себя.</em>',desc:'Несколько простых касаний, чтобы настроить предстоящий сеанс под ваши ощущения. Никаких лишних вопросов.',button:'Настроить сеанс'},{ey:'02 / ИНТЕНСИВНОСТЬ',title:'Найдём <em>ваш ритм.</em>',desc:'Выберите комфортную силу воздействия. Мастер увидит ваше пожелание перед сеансом.',button:'Выбрать зоны'},{ey:'03 / КАРТА ТЕЛА',title:'Где нужно <em>внимание?</em>',desc:'Коснитесь зон, которым хочется уделить больше времени. Этот шаг можно пропустить.',button:'Выбрать атмосферу'},{ey:'04 / АТМОСФЕРА',title:'Ваше <em>состояние.</em>',desc:'Выберите настроение пространства. Мы постараемся создать его для вас.',button:'Дополнения'},{ey:'05 / ДЕТАЛИ',title:'Маленькие <em>радости.</em>',desc:'Дополнительные пожелания к визиту. Это демонстрационные позиции без оформления заказа.',button:'Посмотреть итог'},{ey:'06 / ГОТОВО',title:'Всё <em>по-вашему.</em>',desc:'Ваши предпочтения собраны. В реальной версии их можно будет передавать администратору и мастеру через CRM.',button:'Начать заново'}];
function ribbon(){return `<svg class="ribbon float" viewBox="0 0 600 600" role="img" aria-label="Абстрактная скульптура из переплетённых плавных лент"><defs><linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4f0df"/><stop offset=".34" stop-color="#79a8a4"/><stop offset=".72" stop-color="#315d63"/><stop offset="1" stop-color="#e2c6a7"/></linearGradient><linearGradient id="r2"><stop stop-color="#f1d9b7"/><stop offset="1" stop-color="#8ac5b6"/></linearGradient></defs><g class="orbit"><circle cx="300" cy="300" r="212" stroke="#8eafa555" fill="none" stroke-width="1" stroke-dasharray="2 14"/><circle cx="300" cy="300" r="177" stroke="#8eafa533" fill="none" stroke-width="1"/></g><path class="line a" d="M157 320 C100 170 280 80 405 167 C535 258 446 410 326 456 C214 500 127 410 183 325 C242 238 381 252 399 337 C422 438 242 465 235 341 C229 237 361 145 433 235"/><path class="line b" d="M155 321 C99 170 280 80 405 167 C535 258 446 410 326 456 C214 500 127 410 183 325 C242 238 381 252 399 337 C422 438 242 465 235 341 C229 237 361 145 433 235"/><path class="line c" d="M161 320 C104 172 282 85 405 171 C528 258 444 406 324 452 C218 493 132 407 187 328 C245 243 376 257 394 337 C414 428 248 455 240 342 C233 245 362 155 428 238"/></svg>`}
function body(){return `<svg class="bodyfig" viewBox="0 0 280 500" role="group" aria-label="Интерактивная карта тела"><path class="shape" d="M140 30c-23 0-38 18-38 42s13 39 25 46l-6 23-43 13c-19 5-27 24-31 47L20 321c-4 22 23 31 32 10l37-102 4 96-4 99 18 53h66l18-53-4-99 4-96 37 102c9 21 36 12 32-10l-27-120c-4-23-12-42-31-47l-43-13-6-23c12-7 25-22 25-46s-15-42-38-42Z"/><path data-zone="neck" class="zone" d="M121 133l19 14 19-14 15 12-34 30-34-30z"/><path data-zone="back" class="zone" d="M96 174l44 12 44-12-3 90-41 18-41-18z"/><path data-zone="waist" class="zone" d="M99 276l41 14 41-14 3 43-44 24-44-24z"/><path data-zone="arms" class="zone" d="M77 162l20 12-11 80-32 78-18-8 25-122z M203 162l-20 12 11 80 32 78 18-8-25-122z"/><path data-zone="legs" class="zone" d="M96 334l44 17-8 113h-25l-17-49z M184 334l-44 17 8 113h25l17-49z"/><circle class="joint" cx="140" cy="82" r="4"/></svg>`}
function render(){const i=state.step,p=pages[i];$('#eyebrow').textContent=p.ey;$('#headline').innerHTML=p.title;$('#description').textContent=p.desc;$('#stepnum').textContent=String(i+1).padStart(2,'0')+' / 06';$('#progress').innerHTML=pages.map((_,n)=>`<span class="${n<=i?'on':''}"></span>`).join('');$('#nextlabel').textContent=p.button;$('#back').style.display=i?'inline-block':'none';$('#visualnote').textContent=['SCULPTED BY STILLNESS','PRESSURE / 01—05','BODY / FOCUS','MOOD / SPACE','DETAILS / CARE','YOUR SESSION / READY'][i];$('#caption').textContent=['ТИШИНА. ДВИЖЕНИЕ. ВНИМАНИЕ.','НАСТРОЙКА ОЩУЩЕНИЙ','КАСАНИЕ ВЫБРАННЫХ ЗОН','АТМОСФЕРА ПОД ВАС','ВНИМАНИЕ К ДЕТАЛЯМ','ВАШ ПЕРСОНАЛЬНЫЙ РИТУАЛ'][i];const c=$('#controls'),a=$('#art');c.innerHTML='';if(i===0){a.innerHTML=ribbon()}if(i===1){c.innerHTML=`<div class="levels">${[1,2,3,4,5].map(n=>`<button class="level ${n===state.intensity?'sel':''}" data-level="${n}" aria-label="Интенсивность ${n}" aria-pressed="${n===state.intensity}">${n}</button>`).join('')}</div><div class="hint" id="hint">${intensityText[state.intensity-1]}</div>`;a.innerHTML=`<div class="orb ${state.intensity>=4?'heat':state.intensity<=2?'calm':''}"></div>`;c.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.intensity=+b.dataset.level;render()})}if(i===2){c.innerHTML=`<div class="hint selectedcount">${state.zones.length?state.zones.map(z=>zoneNames[z]).join(' · '):'Нажмите на силуэт, чтобы выбрать зоны'}</div><button class="chip" id="clearzones">Очистить выбор</button>`;a.innerHTML=body();a.querySelectorAll('.zone').forEach(z=>{z.classList.toggle('active',state.zones.includes(z.dataset.zone));z.onclick=()=>{const k=z.dataset.zone;state.zones=state.zones.includes(k)?state.zones.filter(v=>v!==k):[...state.zones,k];render()}});$('#clearzones').onclick=()=>{state.zones=[];render()}}if(i===3){c.innerHTML=`<div class="choices">${['Тишина','Тёплый свет','Спокойная музыка','Приглушённый свет'].map(s=>`<button class="chip ${s===state.mood?'sel':''}" data-mood="${s}">${s}</button>`).join('')}</div>`;a.innerHTML=`<div class="orb ${state.mood.includes('Тёплый')?'heat':state.mood.includes('Приглушённый')?'night':'calm'}"></div>`;c.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood;render()})}if(i===4){let items=[['Травяной чай','После сеанса'],['Аромат','Лёгкий аромат в комнате'],['Патчи','Дополнительный уход'],['Без дополнений','Только массаж']];c.innerHTML=`<div class="addons">${items.map(([name,desc])=>`<button class="addon ${state.extras.includes(name)?'sel':''}" data-extra="${name}"><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div>`;a.innerHTML=ribbon();c.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{const v=b.dataset.extra;state.extras=v==='Без дополнений'?[]:state.extras.includes(v)?state.extras.filter(x=>x!==v):[...state.extras,v];render()})}if(i===5){c.innerHTML=`<div class="summary"><div><span>Интенсивность</span><b>${state.intensity} / 5 · ${intensityText[state.intensity-1]}</b></div><div><span>Зоны</span><b>${state.zones.length?state.zones.map(z=>zoneNames[z]).join(', '):'Без предпочтений'}</b></div><div><span>Атмосфера</span><b>${state.mood}</b></div><div><span>Дополнения</span><b>${state.extras.length?state.extras.join(', '):'Не выбраны'}</b></div></div>`;a.innerHTML=ribbon()} }
$('#next').onclick=()=>{if(state.step===5){state.step=0;state.intensity=3;state.zones=[];state.mood='Тишина';state.extras=[]}else state.step++;render()};$('#back').onclick=()=>{if(state.step>0){state.step--;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.step>0){state.step--;render()}});if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('reduced');render();
</script></body></html>
